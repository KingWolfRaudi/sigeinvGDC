name: CI

on:
  push:
    branches: [main, Dev-branch]
  pull_request:
    branches: [main, Dev-branch]

permissions:
  contents: read

jobs:
  checks:
    name: Lint · Tests · SCA · Secret-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks necesita el historial completo

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies (lockfile congelado)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect --source . --no-banner --redact

      - name: SCA — composer audit (bloquea si hay CVEs)
        run: composer audit --locked

      - name: Lint — Pint (estilo)
        run: vendor/bin/pint --test

      - name: Tests — PHPUnit
        run: vendor/bin/phpunit
